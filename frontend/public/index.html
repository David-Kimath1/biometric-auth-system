<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biometric  Authentication System</title>
     
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link rel="stylesheet" href="/frontend/css/main.css">
<link rel="stylesheet" href="/frontend/css/components.css">
<link rel="stylesheet" href="/frontend//css/animations.css">
</head>
<body>
    <div class="bg-animation"></div>
    <div class="glass-card" id="app">
        <div class="logo-container">
            <i class="fas fa-shield-alt logo-icon"></i>
        </div>
        <h1 class="title">
            <i class="fas fa-fingerprint title-icon"></i>
            Secure Access
        </h1>
        <p class="subtitle">
            Enterprise Biometric Authentication Platform
        </p>
        <div id="loginView">
            <div class="input-group">
                <i class="fas fa-enveloper input-icon"></i>
                <input type="email" placeholder="Email Address" id="email" class="modern-input">
            </div>
            <button id="fingerprintLogin" class="bio-btn fingerprint-btn">
                <i class="fas fa-fingerprint btn-icon"></i>
            </button>
            <button id="faceLogin" class="bio-btn face-btn">
                <i class="fas fa-face-smile btn-icon"></i>
                <span>Sign in with Face ID</span>
            </button>
        </div>
    </div>
</body>
</html>
